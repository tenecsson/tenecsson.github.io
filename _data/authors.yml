# Multi-author directory.
# Usage:
# 1) Set `author: max_tenecsson` (or another key below) in a post/page front matter.
# 2) If `author` is omitted, the site falls back to `site.author` in _config.yml.

max:
  name        : "Max Tenecsson"
  email       : "onthedouble@pm.me"
  bio         : "Personal website posts and notes."
  avatar      : "profile.png"
  github      : "tenecsson"

